# Render Blueprint Specification for one-click deployment
services:
  # 1. Spring Boot Web Service (Backend API)
  - type: web
    name: url-shortener-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Inject connection details from the PostgreSQL database service
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${url-shortener-db.host}:${url-shortener-db.port}/${url-shortener-db.databaseName}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: url-shortener-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: url-shortener-db
          property: password
      # Optional Redis Cache Integration (App automatically falls back to MySQL/Postgres if offline)
      - key: REDIS_HOST
        value: localhost # Configure if you deploy a separate Redis instance

  # 2. React SPA Service (Frontend Static Site)
  - type: web
    name: url-shortener-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Rewrite all routes to index.html for React SPA Router compatibility
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: url-shortener-backend
          type: web
          property: host

databases:
  - name: url-shortener-db
    databaseName: url_shortener
    user: muni_user
    plan: free
