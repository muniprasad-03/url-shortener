# Render Blueprint Specification for one-click deployment
services:
  # 1. Spring Boot Web Service (Backend API)
  - type: web
    name: url-shortener-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Inject connection details from the PostgreSQL database service
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      # Optional Redis Cache Integration (App automatically falls back to MySQL/Postgres if offline)
      - key: REDIS_HOST
        value: localhost # Configure if you deploy a separate Redis instance

databases:
  - name: url-shortener-db
    databaseName: url_shortener
    user: muni_user
    plan: free
